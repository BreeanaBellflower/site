<!doctype html>
<html lang="en" class="intro-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Inside a Transformer</title>
<meta name="description" content="An animated, step-by-step walkthrough of a tiny transformer and its KV cache.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the network unrolled left to right. One station per screen; each step slides the camera one station right. Map on top, caption and controls at the bottom. */
:root{
  --bg:#ffffff; --ink:#0e1013; --ink2:#3a3f47; --muted:#80868f; --line:#e5e7eb; --faint:#f5f6f8; --acc:#2f5bea;
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rh:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b0c0e;--ink:#eceef1;--ink2:#c3c8d0;--muted:#7d8591;--line:#262a30;--faint:#131518;--acc:#7c98ff;color-scheme:dark}
}
:root[data-theme="dark"],:root.intro-dark{--bg:#0b0c0e;--ink:#eceef1;--ink2:#c3c8d0;--muted:#7d8591;--line:#262a30;--faint:#131518;--acc:#7c98ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{min-height:calc(100% - 52px);max-width:880px;margin:0 auto;padding-inline:16px;display:grid;grid-template-rows:auto minmax(430px,1fr) auto}

.portfolio-header{height:52px;max-width:880px;margin:0 auto;padding-inline:16px;display:flex;align-items:center}
.portfolio-header a{font-size:12px;color:var(--ink2);text-decoration-line:underline;text-decoration-style:dotted;text-underline-offset:4px;padding-block:10px}
.portfolio-header a:hover{color:var(--ink)}
.portfolio-header a:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:2px}
/* map */
.map{display:flex;justify-content:center;gap:16px;padding-block:18px 4px}
.grp{display:grid;gap:8px;justify-items:center}
.grp>span{font:500 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);transition:color .3s}
.grp.on>span{color:var(--ink)}
.dts{position:relative;display:flex;gap:12px}
.dts::before{content:"";position:absolute;left:-10px;right:-10px;top:50%;height:1px;background:var(--line)}
.grp:first-child .dts::before{left:4px}
.grp:last-child .dts::before{right:4px}
.map .d{position:relative;width:9px;height:9px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;transition:background .3s,border-color .3s,transform .3s}
.map .d::after{content:"";position:absolute;inset:-9px}
.map .d.done{background:var(--ink2);border-color:var(--ink2)}
.map .d.cur{background:var(--acc);border-color:var(--acc);transform:scale(1.4)}

/* stations */
.vp{position:relative;overflow:hidden}
.station{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.station.slide{transition:transform .64s cubic-bezier(.65,0,.35,1)}
.sin{position:relative;width:100%;max-width:560px}
.instant,.instant *{transition:none!important}
.instant *:not(.cursor){animation:none!important}

/* dock */
.dock{display:grid;gap:14px;padding-block:6px calc(18px + env(safe-area-inset-bottom,0px))}
.cap{margin:0;font-size:16.5px;line-height:1.5;max-width:56ch;min-height:4.5em;letter-spacing:-.005em;transition:opacity .18s}
.cap.fade{opacity:0}
.ctl{display:flex;align-items:center;gap:6px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.ib:disabled{opacity:.35;cursor:default}
.tb{font-size:14px;color:var(--muted);background:none;border:0;padding:10px;cursor:pointer}
.nb{margin-left:auto;height:46px;padding:0 18px 0 22px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.ib:focus-visible,.nb:focus-visible,.tb:focus-visible,.d:focus-visible,.sb:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
svg.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shared marks */
.panel{position:relative;background:var(--faint);border-radius:18px;padding:34px 14px 16px}
.plbl{position:absolute;top:12px;left:16px;font:500 10.5px/1 var(--mono);letter-spacing:.03em;color:var(--muted)}
.lbl{font:500 10.5px/1.3 var(--mono);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.wc{display:inline-flex;align-items:center;gap:9px;flex:none}
.pn{font:500 10.5px/1 var(--mono);color:var(--muted);width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.tw{font-size:15px;width:6.2ch;white-space:nowrap}
.wc.me .tw{color:var(--acc);font-weight:600}
.vg{display:inline-flex;align-items:center;gap:2px;height:26px;flex:none;padding-inline:1px;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.vg i{display:block;width:5px;height:var(--h);border-radius:1px;background:var(--ink2);transform-origin:50% 100%;transform:translateY(calc(var(--h) / -2)) scaleY(var(--s,1));transition:transform .45s cubic-bezier(.3,.7,.2,1),background .45s;transition-delay:calc(var(--j,0) * 22ms)}
.vg i.d{transform-origin:50% 0;transform:translateY(calc(var(--h) / 2)) scaleY(var(--s,1))}
.vg.z i{--s:0}
.vg.acc i{background:var(--acc)}
.vg.dim i{background:var(--muted)}
.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ln{fill:none;stroke:var(--muted);stroke-width:1;opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .55s ease-out,stroke-width .5s,opacity .5s,stroke .4s}
.ln.on{stroke-dashoffset:0}
.ln.acc{stroke:var(--acc);opacity:1;stroke-width:1.6}
.ghost{position:absolute;margin:0;pointer-events:none;z-index:3;transform-origin:left top;white-space:nowrap}
.item{display:grid;gap:5px;justify-items:start}
.item small{font:500 10px/1 var(--mono);color:var(--muted);white-space:nowrap}
.op{font:500 12px/1.2 var(--mono);color:var(--muted);white-space:nowrap}
.pc{font:500 11px/1 var(--mono);color:var(--muted);width:5ch;text-align:right;font-variant-numeric:tabular-nums}

.title-slide{display:grid;gap:18px;padding:24px;max-width:520px;margin:auto;opacity:0;transition:opacity .6s}
.title-slide.on{opacity:1}.title-kicker{font:11px var(--mono);letter-spacing:.08em;color:var(--acc)}
.title-slide h1{margin:0;font-size:clamp(40px,8vw,60px);font-weight:500;line-height:1.06;letter-spacing:-.045em;max-width:9ch}
.title-slide p{margin:0;max-width:30ch;font-size:17px;line-height:1.5;color:var(--ink2)}

/* 1 tokens */
.t1{position:relative;height:330px}
.pline{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:400 clamp(17px,4.6vw,21px)/1.55 var(--mono);transition:opacity .4s;text-wrap:balance}
.pr{color:var(--acc);margin-right:.5em}
.ch{display:none}
.ch.v{display:inline}
.cursor{display:inline-block;width:.55em;height:1.05em;background:var(--acc);vertical-align:-.16em;margin-left:.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .35s}
.t1.b .pline{opacity:0}
.t1.b .stack{opacity:1}
.trow{display:flex;align-items:center;gap:10px;height:var(--rh)}
.trow.st .tw{color:var(--muted)}
.trow.me .tw{color:var(--acc);font-weight:600}
.trow.nx{opacity:0;transition:opacity .4s .5s}
.trow.nx .tw{color:var(--acc);width:auto;border-bottom:1.5px dashed var(--acc);padding:0 10px;line-height:1.2}
.t1.b .trow.nx{opacity:1}

/* 2 embed */
.t2{position:relative;display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;justify-content:center;align-items:center;column-gap:clamp(30px,8vw,60px);row-gap:12px}
.t2>.lbl{text-align:center}
.row{display:flex;align-items:center;height:var(--rh)}
.tbl{display:grid;grid-template-columns:repeat(8,var(--tc,7px));gap:1px}
.tbl i{width:var(--tc,7px);height:var(--tc,7px);border-radius:1.5px;background:color-mix(in oklab,var(--ink) calc(5% + var(--a) * 50%),var(--bg));transition:background .35s}
.tbl i.hl{background:color-mix(in oklab,var(--acc) calc(35% + var(--a) * 65%),var(--bg))}
.tbl i.fl{animation:flash .7s ease-out}
@keyframes flash{30%{background:color-mix(in oklab,var(--acc) 55%,var(--bg))}}
.t2.done .ln:not(.acc){opacity:.16}

/* 2b space */
.t2b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.srcw{display:grid;gap:8px;justify-items:center}
.srcw .lbl{color:var(--acc)}
.plot{position:relative;height:270px;min-width:0}
.sp{display:block;overflow:visible}
.sp .ax{stroke:var(--line);stroke-width:1}
.sp text{font-family:var(--sans);font-size:12.5px;fill:var(--ink)}
.sp .axl,.sp .hl{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.sp circle{fill:var(--ink2)}
.sp .f circle{fill:var(--muted)}
.sp .f text{fill:var(--muted)}
.sp .w circle{fill:var(--acc)}
.sp .w text{fill:var(--acc);font-weight:600}
.sp .pt{opacity:0;transition:opacity .4s;transition-delay:calc(var(--k) * 70ms)}
.sp.p1 .pt.w{opacity:1;transition-delay:0s}
.sp.p2 .pt{opacity:1}
.sp .halo{fill:color-mix(in oklab,var(--acc) 7%,transparent);stroke:color-mix(in oklab,var(--acc) 24%,transparent);stroke-width:1}
.sp .halos{opacity:0;transition:opacity .7s}
.sp.p3 .halos{opacity:1}

/* embedding offsets */
.offsets{display:block;width:100%;overflow:visible}
.offsets text{font:14px var(--sans);fill:var(--ink)}
.offsets circle{fill:var(--ink2)}
.offsets .end{opacity:0;transition:opacity .35s}
.offsets .end.on{opacity:1}
.offsets .end circle{fill:var(--acc)}
.offsets .end text{fill:var(--acc)}
.offsets .tip{fill:none;stroke:var(--acc);stroke-width:1.6}
.offset-eq{opacity:0;transition:opacity .4s;display:flex;gap:5px 10px;justify-content:center;flex-wrap:wrap}
.offset-eq.on{opacity:1}

/* attention overview */
.attention-overview{position:relative;display:grid;grid-template-columns:auto minmax(52px,1fr) auto;grid-template-rows:18px;grid-auto-rows:26px;gap:0 8px;align-items:center}
.overview-row{display:flex;align-items:center;gap:6px}
.overview-row .wc{gap:6px}
.overview-row .tw{font-size:13px;width:5.7ch}
.overview-row.focus .tw{color:var(--acc)}
.overview-out{display:flex;align-items:center}
.attention-block{position:relative;align-self:stretch;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;z-index:1;background:var(--faint);margin-block:5px;transition:border-color .5s}
.attention-block .lbl{font-size:9px}
.attention-block.on{border-color:var(--acc)}

/* A single attention component, with nested camera views. */
.station.attention-inside{background:var(--faint)}
.camera-stage{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:var(--bg);z-index:4}
.attention-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.attention-frame{position:absolute;inset:0;border:2px solid var(--line);border-radius:32px;background:var(--faint)}
.attention-world-title{position:absolute;left:7%;top:2.5%;font:500 52px/1 var(--mono);color:var(--muted)}
.attention-branches{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.attention-branches path{fill:none;stroke:var(--line)}
.attention-branches text{font-family:var(--mono);fill:var(--muted)}
.attention-location{position:absolute;transform-origin:0 0}
.attention-snapshot,.camera-detail{transform-origin:0 0}
.camera-static,.camera-static *{animation:none!important;transition:none!important}
.attention-glyph{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;border:2px solid var(--line);border-radius:18px;background:var(--bg);opacity:0}
.attention-glyph-title{font-family:var(--mono);font-weight:500;color:var(--ink2)}
.attention-glyph-vector{display:grid;place-items:center}
.attention-glyph-vector>.vg{transform-origin:center}
.camera-detail{position:absolute;z-index:2}
.attention-map{position:relative;height:370px;width:100%}

/* one projection at a time */
.projection-one{display:grid;gap:10px}
.matrix-flow{display:grid;grid-template-columns:minmax(0,1fr) 12px auto 12px minmax(0,1fr);gap:8px;align-items:center;padding-block:4px}
.matrix-end{display:grid;gap:10px;justify-items:center}
.matrix-end .wc{gap:6px}
.matrix-end .tw{font-size:14px;width:5.5ch}
.matrix-arrow{font:12px var(--mono);color:var(--muted);opacity:.15;transition:opacity .4s}
.matrix-arrow.on{opacity:1}
.wm{display:grid;grid-template-columns:repeat(4,11px);gap:3px;padding:2px 5px;border-inline:1px solid var(--line)}
.wm i{width:11px;height:11px;border-radius:1px;background:color-mix(in oklab,var(--ink) calc(8% + var(--a) * 55%),var(--faint));transition:background .4s}
.wm.active i{background:color-mix(in oklab,var(--acc) calc(15% + var(--a) * 65%),var(--faint))}
.matrix-status{margin:0;text-align:center;font:11px/1.5 var(--mono);color:var(--ink2);min-height:3em}
.matrix-samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;opacity:0;transition:opacity .4s}
.matrix-samples.on{opacity:1}
.matrix-sample{display:grid;gap:8px;justify-items:center}
.feature-space{display:grid;gap:18px;max-width:410px;margin-inline:auto}
.feature-intro{display:flex;gap:12px;align-items:center;justify-content:center}
.feature-intro .tw{width:auto}
.feature-map{display:grid;gap:5px}
.feature-columns,.feature-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,18px);gap:10px;align-items:center}
.feature-columns .lbl{font-size:9px;white-space:normal}
.feature-axis{text-align:center;font:10px var(--mono);color:var(--muted);transition:color .4s}
.feature-axis.on{color:var(--acc)}
.feature-row{min-height:44px;opacity:0;transition:opacity .45s}
.feature-row.on{opacity:1}
.feature-name{font-size:14px;line-height:1.35;transition:color .4s}
.feature-row.current .feature-name{color:var(--acc)}
.feature-cell{width:12px;height:12px;justify-self:center;border-radius:2px;background:var(--line);transition:background .45s}
.feature-row.on .feature-cell.used{background:color-mix(in oklab,var(--acc) calc(var(--a) * 85%),var(--line))}
.feature-note{margin:0;font:10px/1.5 var(--mono);text-align:center;color:var(--muted)}
.feature-example{min-height:44px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;opacity:0;transition:opacity .5s;font-size:14px}
.feature-example.on{opacity:1}
.feature-example small{font:10px/1.4 var(--mono);color:var(--muted);text-align:center}
.ar{font:500 11px var(--mono);color:var(--muted);text-align:center}
.foot{margin:12px 0 0;text-align:center;white-space:normal;line-height:1.5}

/* multiple heads */
.heads{display:grid;gap:12px}
.heads-input{display:flex;gap:12px;align-items:center;justify-content:center}
.heads-table{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.head-heading{display:grid;gap:6px;justify-items:center}
.head-matrices{display:flex;gap:9px}
.head-matrices .item{justify-items:center;gap:3px}
.head-matrices small{font-size:8px}
.mini-matrix{display:grid;grid-template-columns:repeat(8,2px);gap:1px}
.mini-matrix i{width:2px;height:2px;background:color-mix(in oklab,var(--ink) calc(10% + var(--a) * 65%),var(--faint))}
.head-word{font-size:13px;line-height:22px}
.head-weight{display:flex;gap:5px;align-items:center}
.head-weight .pc{font-size:10px;width:3.5ch;flex:none}
.head-track{height:5px;min-width:0;flex:1;background:var(--line);border-radius:3px;overflow:hidden}
.head-fill{display:block;width:0;height:100%;background:var(--acc);transition:width .8s}
.heads-table>.item{justify-self:center}
.heads-result{justify-content:center;gap:8px}
.heads-result .item{justify-items:center}
@media(max-width:480px){.map{gap:10px}.dts{gap:3px}}

/* attention at every position */
.attn-grid{display:grid;gap:2px}
.attn-head,.attn-row,.attn-values{display:grid;grid-template-columns:82px minmax(0,1fr) 30px;gap:10px;align-items:center}
.attn-head{margin-bottom:6px}
.attn-head>.lbl:last-child{text-align:center}
.attn-keys,.weight-strip,.value-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.attn-keys>span{display:grid;justify-items:center;gap:3px;font:9px var(--mono);color:var(--muted)}
.attn-keys .vg,.value-strip .vg{gap:1px;height:18px;padding:0}
.attn-keys .vg i,.value-strip .vg i{width:2px}
.attn-row{height:22px}
.attn-row>.vg{height:22px}
.attn-row .wc{gap:7px}
.attn-row .tw{font-size:14px}
.attn-row.focus .tw{color:var(--acc)}
.weight-cell{height:12px;border-radius:2px;background:var(--line);opacity:.3;transition:background .3s,opacity .3s}
.weight-cell.future{background:linear-gradient(135deg,transparent 44%,var(--muted) 46%,var(--muted) 54%,transparent 56%)}
.attn-row.scores .weight-cell:not(.future){opacity:.8;background:color-mix(in oklab,var(--ink) calc(8% + var(--s) * 50%),var(--faint))}
.attn-row.weights .weight-cell:not(.future){opacity:1;background:color-mix(in oklab,var(--acc) calc(5% + var(--w) * 95%),var(--faint))}
.attn-values{margin-top:7px}
.value-strip>.vg{justify-self:center;opacity:.2;transition:opacity .3s}
.attn-formula{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px;font:10px/1.5 var(--mono);color:var(--muted)}
.attn-formula .active{color:var(--acc)}

/* 4 scores */
.t4{position:relative;display:grid;grid-template-columns:auto minmax(28px,100px) auto;grid-auto-rows:26px;align-items:center;justify-content:center}
.krow{grid-column:1;display:flex;align-items:center;gap:9px}
.krow .pc{opacity:0;transition:opacity .4s}
.t4.w .krow .pc{opacity:1}
.t4.scores .krow .pc{opacity:1}
.krow.hid{opacity:.38}
.t4.w .krow.gl .tw,.t4.w .krow.gl .pc{color:var(--acc);font-weight:600}
.t4.w .krow.gl .vg i{background:var(--acc)}
.qcol{grid-column:3;display:flex;align-items:center;gap:8px}
.qcol .tw{width:auto;color:var(--acc);font-weight:600}
.dot-example{display:grid;gap:7px;margin-top:14px;text-align:center}
.dot-terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dot-term{display:grid;gap:3px;font:500 clamp(9px,2.7vw,11px)/1.4 var(--mono);color:var(--muted)}
.dot-term b{font-weight:500;color:var(--acc);opacity:0;transition:opacity .3s}
.dot-term.on b{opacity:1}
.math-note{font:10.5px/1.5 var(--mono);color:var(--ink2);margin:0;text-align:center;min-height:3em}
.dot-example .math-note{min-height:1.5em}

/* 5 mix */
.t5{position:relative;display:grid;grid-template-columns:auto auto;column-gap:clamp(20px,6vw,52px);align-items:center;justify-content:center}
.mrow{display:flex;align-items:center;gap:8px;height:var(--rh)}
.mrow.gl .tw,.mrow.gl .pc{color:var(--acc);font-weight:600}
.eqcol{display:grid;gap:12px;justify-items:start}
.eqr{display:flex;align-items:flex-end;gap:10px;opacity:0;transform:translateX(-6px);transition:opacity .4s,transform .4s}
.eqr.on{opacity:1;transform:none}
.t5+.math-note{margin-top:14px}

/* 6 feed-forward */
.t6{display:grid;gap:16px;justify-items:center}
.mlp{display:block;max-width:100%;height:auto;overflow:visible}
.mlp line{stroke:var(--line);stroke-width:.7}
.mlp circle{fill:color-mix(in oklab,var(--ink) calc(12% + var(--a) * 66%),var(--bg));transition:fill .5s}
.mlp .n2 circle{fill:color-mix(in oklab,var(--acc) calc(25% + var(--a) * 75%),var(--bg))}

matrixLesson('value','The value is the information a token can contribute. Its matrix extracts this information separately from the key, so matching features and contributed information can differ. The query–key match decides how much of the value to use. Here, part of the value from “glass” will be mixed into “it”.',WV,GLASS,[GLASS,3,IT]),

featureLesson('value','Value space holds information worth passing onward. For “glass”, imagine patterns for a container, holding liquid, or having capacity. A share of that information can enter the vector for “it”, helping later layers reason about what it refers to. Elsewhere, useful values might carry a name, grammatical number, or an action.',GLASS,['container','can hold liquid','has capacity'],['glass','→ container information →','it']),

{cap:'These three projections sit inside the same attention head. Every input token produces a query, a key and a value in parallel. Queries and keys determine the attention shares; values supply the information to mix.',camera:{level:'overview'},

{cap:'“It” compares its query with each visible key by multiplying and summing matching coordinates. We divide by √4 because this head has four coordinates. Scaling by the square root of the width keeps scores from growing simply because vectors are wider, which would make softmax too sharply peaked. Softmax turns the scores into shares totaling 100%.',
 build:function(inner){
   var p=panel('attention · where “it” looks'),g=h('div',{class:'t4'}),rows=[],keyBars=[],percentages=[];
   for(var j=0;j<N;j++){
     var hid=j>IT,kb=bars(RAWK[j]),pc=h('span',{class:'pc',text:hid?'hidden':S1[IT][j].toFixed(2)});
     var r=h('div',{class:'krow'+(j===GLASS?' gl':'')+(hid?' hid':''),style:'grid-row:'+(j+1)},wc(j),kb,pc);
     g.append(r);rows.push(r);keyBars.push(kb);percentages.push(pc);
   }
   var query=bars(RAWQ[IT],'acc'),qb=h('div',{class:'qcol',style:'grid-row:'+(IT+1)},query,h('span',{class:'tw',text:'it'}));
   g.append(qb);
   var terms=h('div',{class:'dot-terms'}),products=[];
   for(var d=0;d<4;d++){
     var term=h('span',{class:'dot-term'},h('span',{text:Q[IT][d].toFixed(1)+' × '+K[GLASS][d].toFixed(1)}),h('b',{text:(Q[IT][d]*K[GLASS][d]).toFixed(2)}));
     terms.append(term);products.push(term);
   }
   var note=h('p',{class:'math-note',text:'position rotates query/key pairs before matching'});
   p.append(g,h('div',{class:'dot-example'},h('span',{class:'lbl',text:'query for “it” × key for “glass”'}),terms,note));inner.append(p);
   var svg=overlay(g),q=rel(query,g),mx=Math.max.apply(null,WIT),paths=[];
   for(j=0;j<=IT;j++){var a=rel(rows[j],g);paths.push(path(svg,curve(a.x+a.w+6,a.cy,q.x-8,q.cy),j===GLASS?'acc':''));}
   return {play:async function(c){
     await c.wait(250);paintBars(query,Q[IT]);keyBars.forEach(function(b,k){paintBars(b,K[k]);});await c.wait(1200);
     note.textContent='multiply matching coordinates';c.draw(paths[GLASS]);await c.wait(550);
     for(var d=0;d<4;d++){
       keyBars[GLASS].children[d].style.background='var(--acc)';c.cls(products[d],'on');await c.wait(420);
     }
     note.textContent='sum '+dot(Q[IT],K[GLASS]).toFixed(2)+' ÷ √4 = score '+S1[IT][GLASS].toFixed(2);await c.wait(1300);
     paths.forEach(function(pt,j){pt.style.transitionDelay=(j*55)+'ms';c.draw(pt);});
     c.cls(g,'scores');await c.wait(1100);
     note.textContent='softmax: exp(score) ÷ sum of exp(scores)';await c.wait(1300);
     percentages.forEach(function(pc,j){if(j<=IT)pc.textContent=pct(WIT[j]);});
     paths.forEach(function(pt,j){pt.style.transitionDelay='0ms';var w=WIT[j];pt.style.strokeWidth=(0.6+w*9).toFixed(2);pt.style.opacity=(0.14+0.86*w/mx).toFixed(2);});
     c.cls(g,'w');
     var total=S1[IT].reduce(function(s,x){return s+Math.exp(x);},0);
     note.textContent='glass: '+Math.exp(S1[IT][GLASS]).toFixed(2)+' ÷ '+total.toFixed(2)+' ≈ '+pct(WIT[GLASS]);
   }};
 }},

{cap:'Multiply each value by its share and add coordinate by coordinate, giving a four-number mixture for “it”. The output matrix computes eight different weighted sums on those four numbers to become an update that matches the original token vector’s size. Add the update to that vector: “it” now carries information from its context.',
 build:function(inner){
   var p=panel('attention · updating “it”'),g=h('div',{class:'t5'}),left=h('div'),vs=[];

     var b=bars(V[j],j===GLASS?'acc':'');
     left.append(h('div',{class:'mrow'+(j===GLASS?' gl':'')},wc(j),b,h('span',{class:'pc',text:pct(WIT[j])})));vs.push(b);
   }
   var h1=bars([0,0,0,0],'z acc'),up=bars(SINGLEUPDATES[IT],'z'),ri=bars(ROWIT,'z'),nr=bars(SINGLEROWS[IT],'z acc');
   var r1=h('div',{class:'eqr'},item(h1,'one mixture'));
   var r2=h('div',{class:'eqr'},h('span',{class:'op',text:'output matrix ↓'}));
   var r3=h('div',{class:'eqr'},item(up,'context update'));
   var r4=h('div',{class:'eqr'},h('span',{class:'op',text:'+'}),item(ri,'original “it”'));
   var r5=h('div',{class:'eqr'},h('span',{class:'op',text:'='}),item(nr,'updated “it”'));
   var note=h('p',{class:'math-note',text:'multiply each value by its share'});
   g.append(left,h('div',{class:'eqcol'},r1,r2,r3,r4,r5));p.append(g,note);inner.append(p);
   return {play:async function(c){
     c.cls(r1,'on');await c.wait(350);
     vs.forEach(function(v,j){paintBars(v,V[j].map(function(x){return x*WIT[j];}));});
     note.textContent='glass, first coordinate: '+V[GLASS][0].toFixed(2)+' × '+pct(WIT[GLASS])+' ≈ '+(V[GLASS][0]*WIT[GLASS]).toFixed(2);
     await c.wait(1500);h1.classList.remove('z');
     if(!c.instant){
       var sum=[0,0,0,0];
       for(var j=0;j<=IT;j++){
         (function(k){fly(vs[k],h1,inner,650,true,function(){sum=sum.map(function(x,d){return x+V[k][d]*WIT[k];});paintBars(h1,sum);});})(j);
         await c.wait(160);

     paintBars(h1,BLEND);note.textContent='each of the four coordinates is a weighted sum';await c.wait(950);
     c.cls(r2,'on');await c.wait(650);
     c.cls(r3,'on');up.classList.remove('z');note.textContent='4 numbers → learned projection → 8 numbers';await c.wait(850);
     c.cls(r4,'on');ri.classList.remove('z');await c.wait(600);
     c.cls(r5,'on');nr.classList.remove('z');note.textContent='token vector + context update';
   }};
 }},

{cap:'That calculation runs for every token. Each token has its own query, so each gets different weights and a different mixture. The diagonal boundary hides later tokens: a token can use only itself and what came before. All prompt tokens can be processed in parallel.',
 build:function(inner){
   var p=panel('attention · one head, every position'),g=h('div',{class:'attn-grid'}),keys=h('div',{class:'attn-keys'}),rows=[],values=[];
   for(var k=0;k<N;k++)keys.append(h('span',null,h('span',{text:String(k)}),bars(K[k])));
   g.append(h('div',{class:'attn-head'},h('span',{class:'lbl'},'keys →',h('br'),'query ↓'),keys,h('span',{class:'lbl',text:'mix'})));
   for(var k=0;k<N;k++){
     var strip=h('div',{class:'weight-strip'}),out=bars(MIXES[k],'z acc');
     for(var j=0;j<N;j++)strip.append(h('span',{class:'weight-cell'+(j>k?' future':''),style:'--s:'+(j<=k?(1/(1+Math.exp(-S1[k][j]))).toFixed(3):0)+';--w:'+(j<=k?WEIGHTS[k][j].toFixed(4):0),'aria-label':j>k?'position '+j+': masked':'position '+j+': '+pct(WEIGHTS[k][j])}));
     var row=h('div',{class:'attn-row'},wc(k),strip,out);g.append(row);rows.push([row,out]);
   }
   var valueStrip=h('div',{class:'value-strip'});
   for(var k=0;k<N;k++){var v=bars(V[k]);valueStrip.append(v);values.push(v);}
   g.append(h('div',{class:'attn-values'},h('span',{class:'lbl',text:'values'}),valueStrip,h('span')));
   var phases=[h('span',{text:'q · k / √4'}),h('span',{text:'softmax'}),h('span',{text:'Σ weight × value'})];
   p.append(g,h('div',{class:'attn-formula'},phases[0],h('span',{text:'→'}),phases[1],h('span',{text:'→'}),phases[2]),h('p',{class:'lbl foot',text:'shown one row at a time · computed in parallel'}));inner.append(p);
   function phase(n){phases.forEach(function(el,k){el.classList.toggle('active',n===k);});}
   return {play:async function(c){
     await c.wait(250);
     for(var k=0;k<N;k++){
       rows.forEach(function(r){r[0].classList.remove('focus');});
       c.cls(rows[k][0],'focus');phase(0);c.cls(rows[k][0],'scores');await c.wait(350);
       phase(1);c.cls(rows[k][0],'weights');await c.wait(350);
       phase(2);values.forEach(function(v,j){v.style.opacity=j<=k?(0.2+0.8*WEIGHTS[k][j]/Math.max.apply(null,WEIGHTS[k])).toFixed(3):'.08';});
       rows[k][1].classList.remove('z');await c.wait(550);
     }
     rows.forEach(function(r){r[0].classList.remove('focus');});phase(-1);
     values.forEach(function(v){v.style.opacity='1';});
   }};
 }},

{cap:'A head is one set of key, query and value projections and the attention calculation that follows. Heads read the same token vectors, but learn their own weights, so they can find different relationships. They run in parallel. Their mixtures are joined and projected into one update, which is added to the input token vector.',
 build:function(inner){
   var p=panel('attention · multiple heads'),g=h('div',{class:'heads'}),table=h('div',{class:'heads-table'}),weights=[WIT,W2it],matrices=[[WQ,WK,WV],[WQ2,WK2,WV2]],fills=[];
   g.append(h('div',{class:'heads-input'},wc(IT),bars(INPUT[IT]),h('span',{class:'lbl',text:'same input'})));
   table.append(h('span',{class:'lbl',text:'source'}));
   matrices.forEach(function(head,n){
     var icons=h('div',{class:'head-matrices'});
     head.forEach(function(M,k){var icon=h('span',{class:'mini-matrix'});M.forEach(function(row){row.forEach(function(w){icon.append(h('i',{style:'--a:'+A(w)}));});});icons.append(item(icon,['Wq','Wk','Wv'][k]));});
     table.append(h('div',{class:'head-heading'},h('span',{class:'lbl',text:'head '+(n+1)}),icons));
   });
   [GLASS,7,IT,-1].forEach(function(k){
     table.append(h('span',{class:'head-word',text:k<0?'others':SHOW[k]}));
     weights.forEach(function(w){var share=k<0?w.reduce(function(s,x,j){return s+([GLASS,7,IT].indexOf(j)<0?x:0);},0):w[k],fill=h('i',{class:'head-fill'});table.append(h('span',{class:'head-weight'},h('span',{class:'head-track'},fill),h('span',{class:'pc',text:pct(share)})));fills.push([fill,share]);});
   });
   var h1=bars(BLEND,'z acc'),h2=bars(HEAD2,'z acc');
   table.append(h('span',{class:'lbl',text:'mixture'}),item(h1,'4 numbers'),item(h2,'4 numbers'));
   var note=h('p',{class:'math-note',text:'each head has its own learned matrices'});
   var result=h('div',{class:'eqr heads-result'},item(bars(ROWIT),'input vector'),h('span',{class:'op',text:'+'}),item(bars(UPD,'z'),'update'),h('span',{class:'op',text:'='}),item(bars(NEWROW,'z acc'),'new vector'));
   g.append(table,note,result);p.append(g);inner.append(p);
   return {play:async function(c){
     await c.wait(400);fills.forEach(function(x){x[0].style.width=(x[1]*100).toFixed(2)+'%';});
     await c.wait(1200);note.textContent='head 1 favors “glass”; head 2 favors “until”';
     h1.classList.remove('z');h2.classList.remove('z');await c.wait(1700);
     note.textContent='join 4 + 4 numbers → output projection → one update';
     c.cls(result,'on');await c.wait(500);result.querySelectorAll('.vg').forEach(function(b){b.classList.remove('z');});
   }};
 }},

     await c.wait(800);c.cls(example,'on');await c.wait(1100);c.cls(svg,'p3');
     await c.wait(900);note.textContent='the output is an update · the entering vector is preserved';

{cap:'Every token gets an update of the same size as its input. We add the two number by number—not as extra dimensions. The next transformer block receives 10 updated token vectors, still 8 numbers each. Its attention can now draw on the patterns recognized in this layer.',ffview:'overview',
 build:function(inner){

   function label(x,y,text,cls){var t=sv('text',{x:x,y:y,'text-anchor':'middle',class:cls||''});t.textContent=text;svg.append(t);return t;}
   function box(x,y,w,ht){svg.append(sv('rect',{x:x,y:y,width:w,height:ht,rx:9,class:'ff-border'}));}
   var defs=sv('defs'),arrow=sv('marker',{id:'ff-arrow',viewBox:'0 0 6 6',refX:5,refY:3,markerWidth:5,markerHeight:5,orient:'auto'});arrow.append(sv('path',{d:'M0 0 L6 3 L0 6',fill:'none',stroke:'var(--muted)'}));defs.append(arrow);svg.append(defs);

   function matrix(x,y,data,cls){var g=sv('g',{class:'ff-stage '+cls});data.forEach(function(row,k){row.forEach(function(v,d){g.append(sv('rect',{x:x+d*8,y:y+k*8,width:6,height:5,rx:1,fill:k===IT?'var(--acc)':'var(--ink2)',opacity:.2+.75*Math.tanh(Math.abs(v))}));});});svg.append(g);return g;}
   box(5,5,350,370);label(48,23,'layer 1');

   var attention=sv('g',{class:'ff-stage ff-attention'});

   function attentionLabel(y,text,cls){var t=sv('text',{x:72.5,y:y,'text-anchor':'middle',class:cls||''});t.textContent=text;attention.append(t);}
   attentionLabel(132,'attention','ff-title');attentionLabel(151,'output vectors');svg.append(attention);
   wire('M125 137 H146');wire('M72.5 166 V207 H61 V215');wire('M240 197 V210 H180 V215');
   box(151,95,178,99);var net=ffNetwork();net.setAttribute('x',173);net.setAttribute('y',111);net.setAttribute('width',134);net.setAttribute('height',78);net.style.width='134px';net.style.height='78px';net.classList.add('p1','p2','p3');net.querySelectorAll('.ff-hidden').forEach(function(n,k){n.setAttribute('style','--a:'+Math.tanh(Math.abs(PROD[k])).toFixed(2));});svg.append(net);label(240,108,'feed-forward','ff-title');
   label(61,230,'preserved');label(180,230,'update');label(299,230,'to next layer');
   var preserved=matrix(30,240,AFTERATTN,'ff-preserved'),updates=matrix(149,240,FFUPDATES,'ff-updates'),result=matrix(268,240,L1OUT,'ff-result');
   label(120,283,'+','ff-sum');label(239,283,'=','ff-sum');
   label(61,337,'10 × 8');label(180,337,'10 × 8');label(299,337,'10 × 8');
   wire('M299 347 V389 H180 V409');label(180,401,'same shape · updated values');
   box(95,409,170,38);label(180,432,'layer 2 · attention','ff-title');inner.append(svg);
   return {play:async function(c){
     c.cls(attention,'on');c.cls(preserved,'on');c.cls(net,'p1');c.cls(net,'p2');c.cls(net,'p3');
     await c.wait(700);c.cls(updates,'on');await c.wait(1100);c.cls(result,'on');

{cap:'After the last layer, the vector for “was” contains information from the prompt. A learned projection gives every vocabulary token a score for coming next. Softmax turns those scores into probabilities. Lower temperature favors the strongest candidates; higher temperature spreads probability more evenly. Drawing from this distribution selects the next token.',
 build:function(inner){
   var p=panel('output'),top=ORDER.slice(0,6),g=h('div',{class:'t8'});
   var head=h('div',{class:'ohead'},h('span',{class:'tw',text:'was'}),bars(L2WAS,'acc'),h('span',{class:'lbl',text:'→ normalize → 27 scores → softmax'}));
   var list=h('div',{class:'plist'});
   var pb=top.map(function(k){var b=h('span',{class:'pb'}),v=h('span',{class:'pv'});list.append(h('div',{class:'prow'+(k===FULL?' top':'')},h('span',{class:'w2',text:VOCAB[k]}),h('span',{class:'pt'},b),v));return [b,v];});
   var ob=h('span',{class:'pb o'}),ov=h('span',{class:'pv'});
   list.append(h('div',{class:'prow'},h('span',{class:'w2',text:(VOCAB.length-6)+' more'}),h('span',{class:'pt'},ob),ov));
   var slider=h('input',{type:'range',id:'temp',min:'0',max:'2',step:'0.1',value:String(TEMP)}),tv=h('output',{class:'tv',for:'temp'});
   var ruler=h('div',{class:'ruler'}),segs=top.map(function(k,n){var s=h('span',{class:'seg',style:'--s:'+n,text:VOCAB[k]});ruler.append(s);return s;});
   var oseg=h('span',{class:'seg o'});ruler.append(oseg);
   var mk=h('span',{class:'mk'});mk.hidden=true;ruler.append(mk);
   var drawLabel=h('span',{text:'Draw a token'}),btn=h('button',{class:'sb',id:'draw',type:'button'},h('span',{class:'draw-spinner','aria-hidden':'true'}),drawLabel),out=h('span',{class:'out','aria-live':'polite'}),drawTask=null;
   g.append(head,list,h('label',{class:'trow2',for:'temp'},h('span',{class:'lbl',text:'temperature'}),slider,tv),
     h('div',{class:'rw'},ruler,h('div',{class:'ticks'},h('span',{class:'lbl',text:'0'}),h('span',{class:'lbl',text:'1'}))),h('div',{class:'srow'},btn,out));
   p.append(g);inner.append(p);
   function update(reset){
     if(reset!==false&&drawTask)drawTask.cancel();
     TEMP=+slider.value;tv.textContent=TEMP.toFixed(1);
     var P=softmax(LOG,TEMP),rest=1;
     top.forEach(function(k,n){rest-=P[k];pb[n][0].style.width=(P[k]*100).toFixed(1)+'%';pb[n][1].textContent=pct(P[k]);segs[n].style.flexBasis=(P[k]*100).toFixed(2)+'%';segs[n].classList.toggle('tiny',P[k]<0.08);});
     rest=Math.max(0,rest);ob.style.width=(rest*100).toFixed(1)+'%';ov.textContent=pct(rest);oseg.style.flexBasis=(rest*100).toFixed(2)+'%';
     if(reset!==false){mk.hidden=true;out.textContent='';}
   }
   slider.addEventListener('input',update);
   btn.addEventListener('click',async function(){
     if(drawTask)return;
     var owner=run,task=createRun(),temperature=TEMP,P=softmax(LOG,temperature),r=Math.random(),acc=0,pick=ORDER[0];

function worldPose(world,meta,panelRect,view){

function cameraRoute(world,from,to,start,end,view){

  if(different){
    push(parentPose(world,from.kind,view,.56),280);

async function go(n,mode){
  var my=++gen,previous=idx;
  if(run)run.cancel();

  if(cur){
    cur.querySelectorAll('.ghost').forEach(function(g){g.remove();});
    cur.querySelectorAll('[data-c]').forEach(function(c){c.style.visibility='';});

  var from=STEPS[previous].camera,to=STEPS[n].camera;

    var source=old.querySelector('.ff-network'),target=el.querySelector('.ff-network'),a=rel(source,vp),b=rel(target,vp),copy=source.cloneNode(true);
    copy.classList.add('ghost');copy.style.left=f(a.x)+'px';copy.style.top=f(a.y)+'px';copy.style.width=f(a.w)+'px';copy.style.height=f(a.h)+'px';vp.append(copy);
    source.style.visibility='hidden';el.style.opacity='0';
    motion(old,[{opacity:1},{opacity:0}],{duration:280,fill:'forwards'});
    motion(copy,[{transform:'translate(0px,0px) scale(1)'},{transform:'translate('+f(b.x-a.x)+'px,'+f(b.y-a.y)+'px) scale('+(b.w/a.w)+')'}],{duration:1000,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards',id:'ff-pullback'});

      var a=rel(o,vp),b=rel(nw,vp),gh=o.cloneNode(true);
      gh.classList.add('ghost');gh.style.left=f(a.x)+'px';gh.style.top=f(a.y)+'px';gh.style.width=f(a.w)+'px';vp.append(gh);

function next(){
